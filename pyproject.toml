[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codedoc"
version = "1.0.0"
description = "Standards-guided, dependency-aware code-level documentation generation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "openai>=1.0",
    "requests>=2.28",
]

[project.optional-dependencies]
# Re-extracting the criterion sets from the standards PDFs. The extracted sets are
# committed under codedoc/criteria/sets/, so a normal run does not need this.
extract = ["PyMuPDF>=1.23"]
# Language-server based relation extraction (class hierarchy, instantiation,
# overrides) — see docs/DEPENDENCY_BACKENDS.md for the measured comparison.
lsp = ["multilspy>=0.0.11"]

[project.scripts]
codedoc = "codedoc.cli:main"

[tool.setuptools.packages.find]
include = ["codedoc*"]

[tool.setuptools.package-data]
"codedoc.writer" = ["templates/*.txt"]
"codedoc.criteria" = ["sets/*.json"]
